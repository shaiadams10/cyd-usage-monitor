name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Run server and storage tests
        run: python -m unittest discover -s cyd-usage-monitor/server -v
      - name: Validate Compose configuration
        working-directory: cyd-usage-monitor
        run: docker compose --env-file .env.example config --quiet
      - name: Build the server image
        working-directory: cyd-usage-monitor
        run: docker build --pull --tag cyd-usage-monitor-ci .
      - name: Check dashboard JavaScript syntax
        run: |
          python - <<'PY'
          import pathlib, re
          html = pathlib.Path("cyd-usage-monitor/server/dashboard.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, re.S)
          pathlib.Path("dashboard-inline.js").write_text(scripts[-1], encoding="utf-8")
          PY
          node --check dashboard-inline.js

  firmware-and-wasm:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install pinned PlatformIO
        run: python -m pip install platformio==6.1.19
      - name: Build firmware
        working-directory: cyd-usage-monitor
        shell: pwsh
        run: |
          Copy-Item include/secrets.h.example include/secrets.h
          pio run
      - name: Install pinned Emscripten
        shell: pwsh
        run: |
          git clone --depth 1 --branch 3.1.74 https://github.com/emscripten-core/emsdk.git "$env:RUNNER_TEMP\emsdk"
          & "$env:RUNNER_TEMP\emsdk\emsdk.bat" install 3.1.74
          & "$env:RUNNER_TEMP\emsdk\emsdk.bat" activate 3.1.74
      - name: Rebuild and smoke-test WebAssembly assets
        working-directory: cyd-usage-monitor
        shell: pwsh
        run: |
          $env:EMSDK_ROOT = "$env:RUNNER_TEMP\emsdk"
          .\simulator\build-wasm.ps1
          node --check server/static/lvgl/cyd_lvgl.js
          @'
          const fs = require("fs");
          const bytes = fs.readFileSync("server/static/lvgl/cyd_lvgl.wasm");
          WebAssembly.compile(bytes).then(async module => {
            const imports = {};
            for (const item of WebAssembly.Module.imports(module)) {
              imports[item.module] ??= {};
              if (item.kind !== "function") {
                throw new Error(`Unexpected WASM import kind: ${item.kind}`);
              }
              imports[item.module][item.name] = () => {};
            }
            const instance = await WebAssembly.instantiate(module, imports);
            for (const name of ["d", "g", "f", "h"]) {
              if (typeof instance.exports[name] !== "function") {
                throw new Error(`Missing required WASM export: ${name}`);
              }
            }
            instance.exports.d();
            instance.exports.g();
            instance.exports.f();
            instance.exports.h(16);
            console.log("WASM ABI smoke test passed");
          }).catch(error => {
            console.error(error);
            process.exit(1);
          });
          '@ | node -
