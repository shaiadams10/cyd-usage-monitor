name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Run server and storage tests
        run: python -m unittest discover -s cyd-usage-monitor/server -v
      - name: Validate Compose configuration
        working-directory: cyd-usage-monitor
        run: docker compose --env-file .env.example config --quiet
      - name: Build the server image
        working-directory: cyd-usage-monitor
        run: docker build --pull --tag cyd-usage-monitor-ci .
      - name: Check dashboard JavaScript syntax
        run: |
          python - <<'PY'
          import pathlib, re
          html = pathlib.Path("cyd-usage-monitor/server/dashboard.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, re.S)
          pathlib.Path("dashboard-inline.js").write_text(scripts[-1], encoding="utf-8")
          PY
          node --check dashboard-inline.js

  firmware-and-wasm:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Test desktop switching and Windows transport security
        run: python -m unittest discover -s cyd-usage-monitor/scripts -p "test_*.py" -v
      - name: Install pinned PlatformIO
        run: python -m pip install platformio==6.1.19
      - name: Build firmware
        working-directory: cyd-usage-monitor
        shell: pwsh
        run: |
          Copy-Item include/secrets.h.example include/secrets.h
          pio run
      - name: Install pinned Emscripten
        shell: pwsh
        run: |
          git clone --depth 1 --branch 3.1.74 https://github.com/emscripten-core/emsdk.git "$env:RUNNER_TEMP\emsdk"
          & "$env:RUNNER_TEMP\emsdk\emsdk.bat" install 3.1.74
          & "$env:RUNNER_TEMP\emsdk\emsdk.bat" activate 3.1.74
      - name: Rebuild and smoke-test WebAssembly assets
        working-directory: cyd-usage-monitor
        shell: pwsh
        run: |
          $env:EMSDK_ROOT = "$env:RUNNER_TEMP\emsdk"
          .\simulator\build-wasm.ps1 -TestMotion
          .\simulator\build-wasm.ps1
          node --check server/static/lvgl/cyd_lvgl.js
          @'
          global.window = globalThis;
          global.location = { href: "file:///cyd_lvgl.js" };
          global.document = { currentScript: { src: "file:///cyd_lvgl.js" } };
          const fs = require("fs");
          const createCydLvgl = require("./server/static/lvgl/cyd_lvgl.js");
          const wasmBinary = fs.readFileSync("server/static/lvgl/cyd_lvgl.wasm");
          createCydLvgl({ wasmBinary }).then(module => {
            const requiredFunctions = [
              "cyd_init",
              "cyd_tick",
              "cyd_pointer",
              "cyd_publish_provider_mascots",
              "cyd_set_codex",
              "cyd_set_antigravity",
              "cyd_set_error",
              "cyd_set_openrouter",
            ];
            for (const name of requiredFunctions) {
              if (typeof module[`_${name}`] !== "function") {
                throw new Error(`Missing required module export: ${name}`);
              }
            }
            module.ccall("cyd_init", null, [], []);
            console.log("WASM ABI smoke test passed");
          }).catch(error => {
            console.error(error);
            process.exit(1);
          });
          '@ | node -
