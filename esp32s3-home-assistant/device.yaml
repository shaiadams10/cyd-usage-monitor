interval:
  - interval: 10ms
    then:
      - lambda: speaker_tests::tick(id(speaker_out));

script:
  - id: run_speaker_test
    mode: single
    parameters:
      kind: int
    then:
      - if:
          condition:
            lambda: return !id(assistant).is_running() && id(speaker_out).is_stopped();
          then:
            - micro_wake_word.stop:
            - binary_sensor.template.publish: {id: ready_for_voice, state: OFF}
            - text_sensor.template.publish: {id: voice_state, state: "TESTING SPEAKER"}
            - text_sensor.template.publish: {id: interaction_availability, state: "BUSY - SPEAKER TEST"}
            - light.turn_off:
                id: led_ring
                transition_length: 0s
            - delay: 30ms
            - lambda: speaker_tests::start(id(speaker_out), kind);
            - wait_until:
                condition:
                  lambda: return !speaker_tests::active;
                timeout: 16s
            - lambda: speaker_tests::stop(id(speaker_out));
            - script.execute: resume_local_wake_word
          else:
            - logger.log: "Speaker test unavailable while audio or Assist is active"
  - id: ring_ready
    mode: restart
    then:
      - light.turn_on:
          id: led_ring
          effect: "None"
          brightness: 24%
          red: 0%
          green: 100%
          blue: 0%
  - id: ring_listening
    mode: restart
    then:
      - light.turn_on:
          id: led_ring
          effect: "Listening Yellow Rotate"
          brightness: 32%
  - id: ring_processing
    mode: restart
    then:
      - light.turn_on:
          id: led_ring
          effect: "Processing Yellow Breathe"
          red: 100%
          green: 45%
          blue: 0%
  - id: ring_unavailable
    mode: restart
    then:
      - light.turn_on:
          id: led_ring
          effect: "Unavailable Red Pulse"
          red: 100%
          green: 0%
          blue: 0%
  - id: ring_disabled
    mode: restart
    then:
      - light.turn_on:
          id: led_ring
          effect: "None"
          brightness: 12%
          red: 100%
          green: 28%
          blue: 0%
  - id: play_feedback_tone
    mode: restart
    then:
      - speaker.volume_set:
          id: speaker_out
          volume: !lambda |-
            const float level = fmaxf(0.0f, fminf(1.0f, id(speaker_volume).state / 100.0f));
            if (level <= 0.0f) return 0.0f;
            const float target_db = 20.0f * log10f(level);
            return fmaxf(0.0f, fminf(1.0f, (target_db + 49.0f) / 49.0f));
      # Raw speaker.play data has no format metadata. Keep it identical to the
      # Assist response stream so local feedback cannot poison later TTS.
      - lambda: |-
          id(speaker_out).set_audio_stream_info(esphome::audio::AudioStreamInfo(16, 1, 16000));
      # speaker.play is a non-blocking one-shot action. Start the I2S task
      # first so the complete tone reaches its ring buffer instead of racing
      # the driver's asynchronous startup.
      - lambda: id(speaker_out).start();
      - wait_until:
          # speaker.is_playing also returns true during STARTING. Wait for the
          # actual RUNNING state so play/finish cannot race I2S setup.
          condition:
            lambda: return id(speaker_out).is_running();
          timeout: 2500ms
      - lambda: |-
            // Cycle through three very short acknowledgement contours. Keep
            // phase continuous and fade both ends so higher playback levels
            // remain crisp instead of clicking at frequency transitions.
            // A 35 ms, low-energy acknowledgement is immediate but short
            // enough for noise suppression to reject during one-breath audio.
            const uint8_t pattern = id(wake_feedback_variant)++ % 3;
            const size_t sample_count = 560;
            std::vector<uint8_t> audio(sample_count * 2);
            float phase = 0.0f;
            for (size_t i = 0; i < sample_count; i++) {
              const float attack = fminf(1.0f, static_cast<float>(i) / 80.0f);
              const float release = fminf(1.0f, static_cast<float>(sample_count - 1 - i) / 112.0f);
              const float envelope = attack * release;
              float frequency;
              if (pattern == 0) {
                frequency = i < 249 ? 900.0f : 1200.0f;
              } else if (pattern == 1) {
                frequency = 820.0f + 180.0f * static_cast<float>(i) / sample_count;
              } else {
                frequency = i < 280 ? 1200.0f : 900.0f;
              }
              phase += 2.0f * 3.14159265f * frequency / 16000.0f;
              const int16_t sample = static_cast<int16_t>(8000.0f * envelope * sinf(phase));
              const size_t frame = i * 2;
              audio[frame] = static_cast<uint8_t>(sample & 0xFF);
              audio[frame + 1] = static_cast<uint8_t>((sample >> 8) & 0xFF);
            }
            const size_t accepted = id(speaker_out).play(audio.data(), audio.size());
            ESP_LOGI("speaker_probe", "Wake tone PCM accepted: %u/%u bytes (16 kHz, 16-bit, mono)",
                     (unsigned) accepted, (unsigned) audio.size());
      - speaker.finish:
          id: speaker_out
      - wait_until:
          condition:
            speaker.is_stopped:
              id: speaker_out
          timeout: 2s
  - id: resume_local_wake_word
    mode: restart
    then:
      - wait_until:
          condition:
            not:
              voice_assistant.is_running:
                id: assistant
          timeout: 10s
      # The direct Assist stream normally closes Voice Assistant as soon as
      # its PCM stream ends. Keep a generous fail-safe for transport failures,
      # without making it part of the normal confirmation lifecycle.
      - if:
          condition:
            voice_assistant.is_running:
              id: assistant
          then:
            - lambda: |-
                id(last_error).publish_state("tts_stream_timeout: direct Assist stream did not finish within 10s; recovered locally");
                ESP_LOGE("voice_trace", "TTS STREAM WATCHDOG | session=%s | speaker_running=%s | forcing stop",
                         id(current_session_id).state.c_str(), id(speaker_out).is_running() ? "yes" : "no");
                const std::string record = json::build_json([&](JsonObject root) {
                  root["v"] = 1;
                  root["id"] = id(current_session_id).state;
                  root["wake"] = "Hey Burden";
                  root["heard"] = id(last_request).state;
                  root["reply"] = id(last_response).state;
                  root["matched"] = id(matched_command).state;
                  root["result"] = id(action_result).state;
                  root["error"] = "tts_stream_timeout: direct Assist stream did not finish within 10s; recovered locally";
                  root["outcome"] = "TTS STREAM TIMEOUT RECOVERED";
                  root["ok"] = false;
                  root["one_breath"] = id(speech_started_ms) &&
                    id(speech_started_ms) - id(wake_detected_ms) <= 1800;
                  root["wake_pipeline_ms"] = id(pipeline_started_ms) - id(wake_detected_ms);
                  root["replay_ms"] = id(command_microphone).get_last_replay_duration_ms();
                  root["replay_bytes"] = id(command_microphone).get_last_replay_bytes();
                  root["wake_speech_ms"] = id(speech_started_ms)
                    ? id(speech_started_ms) - id(wake_detected_ms) : 0U;
                  root["capture_ms"] = id(speech_started_ms) && id(speech_ended_ms)
                    ? id(speech_ended_ms) - id(speech_started_ms) : 0U;
                  root["stt_ms"] = id(speech_ended_ms) && id(transcript_ready_ms)
                    ? id(transcript_ready_ms) - id(speech_ended_ms) : 0U;
                  root["action_ms"] = id(action_reported) && id(wake_to_action_latency).has_state()
                    ? static_cast<uint32_t>(id(wake_to_action_latency).state) : 0U;
                  root["total_ms"] = millis() - id(pipeline_started_ms);
                  root["pre_roll_ms"] = static_cast<uint32_t>(id(command_pre_roll).state);
                  root["rssi_dbm"] = static_cast<int32_t>(id(wifi_signal_db).state);
                  root["wake_sound"] = id(wake_sound_enabled).state;
                });
                ESP_LOGI("voice_session", "SESSION_JSON %s", record.c_str());
            - speaker.stop:
                id: speaker_out
            - delay: 100ms
            - if:
                condition:
                  voice_assistant.is_running:
                    id: assistant
                then:
                  - voice_assistant.stop:
                      id: assistant
            - wait_until:
                condition:
                  not:
                    voice_assistant.is_running:
                      id: assistant
                timeout: 3s
      - if:
          condition:
            lambda: return id(pipeline_failed);
          then:
            # Keep a failed request visibly red long enough to be understood.
            - delay: 1500ms
          else:
            - delay: 250ms
      - if:
          condition:
            and:
              - voice_assistant.connected
              - switch.is_on: wake_word_enabled
              - not:
                  voice_assistant.is_running:
                    id: assistant
          then:
            - micro_wake_word.start
            - text_sensor.template.publish:
                id: voice_state
                state: "WAITING FOR WAKE WORD"
            - text_sensor.template.publish:
                id: interaction_availability
                state: "READY - SAY HEY BURDEN"
            - binary_sensor.template.publish:
                id: ready_for_voice
                state: ON
            - script.execute: ring_ready
          else:
            - if:
                condition:
                  not:
                    voice_assistant.connected:
                      id: assistant
                then:
                  - text_sensor.template.publish:
                      id: interaction_availability
                      state: "UNAVAILABLE - HOME ASSISTANT OFFLINE"
                  - binary_sensor.template.publish:
                      id: ready_for_voice
                      state: OFF
                  - script.execute: ring_unavailable
                else:
                  - if:
                      condition:
                        switch.is_off: wake_word_enabled
                      then:
                        - text_sensor.template.publish:
                            id: interaction_availability
                            state: "UNAVAILABLE - WAKE WORD DISABLED"
                        - binary_sensor.template.publish:
                            id: ready_for_voice
                            state: OFF
                        - script.execute: ring_disabled
                      else:
                        - text_sensor.template.publish:
                            id: voice_state
                            state: "RECOVERY FAILED"
                        - text_sensor.template.publish:
                            id: interaction_availability
                            state: "ERROR - RESTART DEVICE"
                        - binary_sensor.template.publish:
                            id: ready_for_voice
                            state: OFF
                        - script.execute: ring_unavailable

micro_wake_word:
  id: hey_burden_wake
  microphone:
    microphone: microphone_in
    channels: 0
    gain_factor: 4
  stop_after_detection: true
  vad:
  models:
    - model: wake-word-training/artifacts/hey_burden.json
      id: hey_burden_model
  on_wake_word_detected:
    - lambda: |-
        if (id(boot_session_nonce) == 0) id(boot_session_nonce) = esp_random();
        id(session_sequence)++;
        char session_id[24];
        snprintf(session_id, sizeof(session_id), "%08x-%04u",
                 (unsigned) id(boot_session_nonce), (unsigned) id(session_sequence));
        id(current_session_id).publish_state(session_id);
        id(wake_detected_ms) = millis();
        id(speech_started_ms) = 0;
        id(speech_ended_ms) = 0;
        id(transcript_ready_ms) = 0;
        id(pipeline_failed) = false;
        id(action_reported) = false;
        id(action_succeeded) = false;
        id(last_request).publish_state("");
        id(last_response).publish_state("");
        id(matched_command).publish_state("");
        id(action_result).publish_state("");
        id(last_error).publish_state("");
        id(routing_outcome).publish_state("IN PROGRESS");
        id(wake_to_pipeline_latency).publish_state(NAN);
        id(replay_audio_duration).publish_state(NAN);
        id(replay_audio_bytes).publish_state(NAN);
        id(wake_to_speech_latency).publish_state(NAN);
        id(speech_capture_duration).publish_state(NAN);
        id(stt_processing_latency).publish_state(NAN);
        id(wake_to_action_latency).publish_state(NAN);
        id(total_pipeline_latency).publish_state(NAN);
        id(command_microphone).mark_wake_detected();
        ESP_LOGI("voice_trace", "SESSION %s | LOCAL WAKE HEARD | exact=\"%s\"",
                 session_id, wake_word.c_str());
    - text_sensor.template.publish:
        id: last_wake_word
        state: "Hey Burden"
    - text_sensor.template.publish:
        id: voice_state
        state: "WAKE DETECTED"
    - text_sensor.template.publish:
        id: interaction_availability
        state: "BUSY - WAIT FOR GREEN"
    - binary_sensor.template.publish:
        id: ready_for_voice
        state: OFF
    - script.execute: ring_listening
    - voice_assistant.start:
        wake_word: !lambda return wake_word;
        silence_detection: true

voice_assistant:
  id: assistant
  micro_wake_word: hey_burden_wake
  microphone:
    microphone: command_microphone
    channels: 0
    gain_factor: 4
  speaker: speaker_out
  use_wake_word: false
  noise_suppression_level: 2
  auto_gain: 31dBFS
  # Preserve the full Home Assistant PCM signal; the user-facing speaker
  # control is the only attenuation stage.
  volume_multiplier: 1.0
  conversation_timeout: 120s
  on_client_connected:
    - if:
        condition:
          switch.is_on: wake_word_enabled
        then:
          - micro_wake_word.start
          - text_sensor.template.publish:
              id: voice_state
              state: "WAITING FOR WAKE WORD"
          - text_sensor.template.publish:
              id: interaction_availability
              state: "READY - SAY HEY BURDEN"
          - binary_sensor.template.publish:
              id: ready_for_voice
              state: ON
          - script.execute: ring_ready
        else:
          - text_sensor.template.publish:
              id: voice_state
              state: "WAKE WORD DISABLED"
          - text_sensor.template.publish:
              id: interaction_availability
              state: "UNAVAILABLE - WAKE WORD DISABLED"
          - binary_sensor.template.publish:
              id: ready_for_voice
              state: OFF
          - script.execute: ring_disabled
  on_client_disconnected:
    - micro_wake_word.stop
    - voice_assistant.stop
    - text_sensor.template.publish:
        id: voice_state
        state: "HOME ASSISTANT OFFLINE"
    - text_sensor.template.publish:
        id: interaction_availability
        state: "UNAVAILABLE - HOME ASSISTANT OFFLINE"
    - binary_sensor.template.publish:
        id: ready_for_voice
        state: OFF
    - script.execute: ring_unavailable
  on_start:
    - lambda: |-
        id(pipeline_started_ms) = millis();
        id(speech_started_ms) = 0;
        id(speech_ended_ms) = 0;
        id(transcript_ready_ms) = 0;
        id(pipeline_failed) = false;
        ESP_LOGI("voice_trace", "COMMAND PIPELINE START | wake_to_pipeline=%ums | local wake already matched",
                 (unsigned) (id(pipeline_started_ms) - id(wake_detected_ms)));
    - sensor.template.publish:
        id: wake_to_pipeline_latency
        state: !lambda return id(pipeline_started_ms) - id(wake_detected_ms);
    - text_sensor.template.publish:
        id: voice_state
        state: "STARTING COMMAND"
  on_listening:
    - text_sensor.template.publish:
        id: voice_state
        state: "LISTENING"
    - text_sensor.template.publish:
        id: interaction_availability
        state: "BUSY - LISTENING TO THIS COMMAND"
    - script.execute: ring_listening
    - if:
        condition:
          switch.is_on: wake_sound_enabled
        then:
          - script.execute: play_feedback_tone
  on_stt_vad_start:
    - lambda: |-
        id(speech_started_ms) = millis();
        ESP_LOGI("voice_trace", "SPEECH START | wake_to_speech=%ums | pipeline_to_speech=%ums | replay=%ums/%u bytes",
                 (unsigned) (id(speech_started_ms) - id(wake_detected_ms)),
                 (unsigned) (id(speech_started_ms) - id(pipeline_started_ms)),
                 (unsigned) id(command_microphone).get_last_replay_duration_ms(),
                  (unsigned) id(command_microphone).get_last_replay_bytes());
    - sensor.template.publish:
        id: replay_audio_duration
        state: !lambda return id(command_microphone).get_last_replay_duration_ms();
    - sensor.template.publish:
        id: replay_audio_bytes
        state: !lambda return id(command_microphone).get_last_replay_bytes();
    - sensor.template.publish:
        id: wake_to_speech_latency
        state: !lambda return id(speech_started_ms) - id(wake_detected_ms);
    - text_sensor.template.publish:
        id: voice_state
        state: "HEARING SPEECH"
    - text_sensor.template.publish:
        id: interaction_availability
        state: "BUSY - HEARING YOUR COMMAND"
  on_stt_vad_end:
    - lambda: |-
        id(speech_ended_ms) = millis();
        ESP_LOGI("voice_trace", "SPEECH END | capture=%ums | sending constrained recognition",
                 id(speech_started_ms)
                   ? (unsigned) (id(speech_ended_ms) - id(speech_started_ms)) : 0U);
    - sensor.template.publish:
        id: speech_capture_duration
        state: !lambda |-
          return id(speech_started_ms) ? id(speech_ended_ms) - id(speech_started_ms) : 0U;
    - text_sensor.template.publish:
        id: voice_state
        state: "PROCESSING"
    - text_sensor.template.publish:
        id: interaction_availability
        state: "BUSY - TRANSCRIBING"
    - script.execute: ring_processing
  on_stt_end:
    - lambda: |-
        id(transcript_ready_ms) = millis();
        ESP_LOGI("voice_trace", "HEARD EXACT | \"%s\" | recognition=%ums | total=%ums",
                 x.c_str(),
                 (unsigned) (id(transcript_ready_ms) - id(speech_started_ms)),
                  (unsigned) (id(transcript_ready_ms) - id(pipeline_started_ms)));
    - sensor.template.publish:
        id: stt_processing_latency
        state: !lambda |-
          return id(speech_ended_ms) ? id(transcript_ready_ms) - id(speech_ended_ms) : NAN;
    - text_sensor.template.publish:
        id: last_request
        state: !lambda return x;
  on_tts_start:
    - lambda: |-
        // Voice Assistant audio messages contain raw PCM bytes but no stream
        // metadata. Restore the protocol's fixed format before its deferred
        // speaker start, especially after a local diagnostic sweep.
        id(speaker_out).set_audio_stream_info(esphome::audio::AudioStreamInfo(16, 1, 16000));
        ESP_LOGI("voice_trace", "ASSISTANT EXACT | \"%s\" | output=16kHz/16-bit/mono", x.c_str());
    - text_sensor.template.publish:
        id: last_response
        state: !lambda return x;
  on_tts_stream_start:
    - speaker.volume_set:
        id: speaker_out
        volume: !lambda |-
          const float level = fmaxf(0.0f, fminf(1.0f, id(speaker_volume).state / 100.0f));
          if (level <= 0.0f) return 0.0f;
          const float target_db = 20.0f * log10f(level);
          return fmaxf(0.0f, fminf(1.0f, (target_db + 49.0f) / 49.0f));
    - text_sensor.template.publish:
        id: voice_state
        state: "SPEAKING"
    - text_sensor.template.publish:
        id: interaction_availability
        state: "BUSY - ASSISTANT SPEAKING"
    # The ring shares the USB-derived rail with the amplifier. Turn it fully
    # off only while PCM is playing to reserve maximum instantaneous current
    # for clean speaker peaks.
    - light.turn_off: led_ring
    - lambda: ESP_LOGI("voice_trace", "SPEAKER STREAM START");
  on_tts_stream_end:
    - lambda: ESP_LOGI("voice_trace", "SPEAKER STREAM END");
  on_intent_start:
    - text_sensor.template.publish:
        id: voice_state
        state: "MATCHING COMMAND"
    - text_sensor.template.publish:
        id: interaction_availability
        state: "BUSY - RUNNING YOUR ACTION"
    - script.execute: ring_processing
    - lambda: ESP_LOGI("voice_trace", "COMMAND MATCH START");
  on_intent_end:
    - lambda: ESP_LOGI("voice_trace", "COMMAND MATCH END");
  on_error:
    - lambda: |-
        id(pipeline_failed) = true;
        ESP_LOGE("voice_trace", "PIPELINE ERROR | %s | %s", code.c_str(), message.c_str());
    - text_sensor.template.publish:
        id: last_error
        state: !lambda |-
          return code + ": " + message;
    - text_sensor.template.publish:
        id: voice_state
        state: "ERROR"
    - text_sensor.template.publish:
        id: interaction_availability
        state: "ERROR - WAIT FOR RECOVERY"
    - binary_sensor.template.publish:
        id: ready_for_voice
        state: OFF
    - script.execute: ring_unavailable
  on_end:
    - lambda: |-
        std::string outcome;
        if (id(pipeline_failed)) {
          outcome = "PIPELINE ERROR";
        } else if (id(action_reported) && id(action_succeeded)) {
          outcome = "CUSTOM ACTION SUCCEEDED";
        } else if (id(action_reported)) {
          outcome = "CUSTOM ACTION FAILED";
        } else if (id(last_request).has_state() && !id(last_request).state.empty()) {
          outcome = "UNROUTED OR GENERIC INTENT";
        } else {
          outcome = "NO TRANSCRIPT";
        }
        id(routing_outcome).publish_state(outcome);

        const uint32_t now = millis();
        const uint32_t wake_to_pipeline = id(pipeline_started_ms) - id(wake_detected_ms);
        const uint32_t wake_to_speech = id(speech_started_ms)
          ? id(speech_started_ms) - id(wake_detected_ms) : 0U;
        const uint32_t capture = id(speech_started_ms) && id(speech_ended_ms)
          ? id(speech_ended_ms) - id(speech_started_ms) : 0U;
        const uint32_t stt = id(speech_ended_ms) && id(transcript_ready_ms)
          ? id(transcript_ready_ms) - id(speech_ended_ms) : 0U;
        const uint32_t action = id(action_reported) && id(wake_to_action_latency).has_state()
          ? static_cast<uint32_t>(id(wake_to_action_latency).state) : 0U;
        const uint32_t total = now - id(pipeline_started_ms);
        auto trim = [](const std::string &value, size_t limit) {
          return value.size() <= limit ? value : value.substr(0, limit - 3) + "...";
        };
        const std::string record = json::build_json([&](JsonObject root) {
          root["v"] = 1;
          root["id"] = id(current_session_id).state;
          root["wake"] = "Hey Burden";
          root["heard"] = trim(id(last_request).state, 56);
          root["reply"] = trim(id(last_response).state, 72);
          root["matched"] = trim(id(matched_command).state, 40);
          root["result"] = trim(id(action_result).state, 72);
          root["error"] = trim(id(last_error).state, 72);
          root["outcome"] = outcome;
          root["ok"] = id(action_reported) && id(action_succeeded);
          root["one_breath"] = wake_to_speech > 0 && wake_to_speech <= 1800;
          root["wake_pipeline_ms"] = wake_to_pipeline;
          root["replay_ms"] = id(command_microphone).get_last_replay_duration_ms();
          root["replay_bytes"] = id(command_microphone).get_last_replay_bytes();
          root["wake_speech_ms"] = wake_to_speech;
          root["capture_ms"] = capture;
          root["stt_ms"] = stt;
          root["action_ms"] = action;
          root["total_ms"] = total;
          root["pre_roll_ms"] = static_cast<uint32_t>(id(command_pre_roll).state);
          root["rssi_dbm"] = static_cast<int32_t>(id(wifi_signal_db).state);
          root["wake_sound"] = id(wake_sound_enabled).state;
        });
        ESP_LOGI("voice_session", "SESSION_JSON %s", record.c_str());
    - sensor.template.publish:
        id: total_pipeline_latency
        state: !lambda return millis() - id(pipeline_started_ms);
    - text_sensor.template.publish:
        id: pipeline_timing
        state: !lambda |-
          char timing[72];
          snprintf(timing, sizeof(timing), "Total %ums, capture %ums, STT %ums",
                   (unsigned) (millis() - id(pipeline_started_ms)),
                   id(speech_ended_ms) && id(speech_started_ms)
                     ? (unsigned) (id(speech_ended_ms) - id(speech_started_ms)) : 0U,
                   id(transcript_ready_ms) && id(speech_ended_ms)
                     ? (unsigned) (id(transcript_ready_ms) - id(speech_ended_ms)) : 0U);
          return std::string(timing);
    - lambda: |-
        ESP_LOGI("voice_trace", "PIPELINE END | total=%ums",
                 (unsigned) (millis() - id(pipeline_started_ms)));
    - script.execute: resume_local_wake_word
