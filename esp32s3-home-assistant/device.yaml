    web_server:
      sorting_group_id: dashboard_voice
      sorting_weight: 70
  - platform: template
    id: wake_to_action_latency
    name: "Wake to Action"
    icon: mdi:lightning-bolt
    unit_of_measurement: "ms"
    accuracy_decimals: 0
    update_interval: never
    entity_category: diagnostic
    web_server:
      sorting_group_id: dashboard_voice
      sorting_weight: 72
  - platform: template
    id: total_pipeline_latency
    name: "Total Busy Time"
    icon: mdi:timer-check
    unit_of_measurement: "ms"
    accuracy_decimals: 0
    update_interval: never
    entity_category: diagnostic
    web_server:
      sorting_group_id: dashboard_voice
      sorting_weight: 74
  - platform: wifi_signal
    id: wifi_signal_db
    name: "Wi-Fi Signal"
    update_interval: 10s
    entity_category: diagnostic
    web_server:
      sorting_group_id: dashboard_connection
      sorting_weight: 40
