substitutions:
  device_name: esp32s3-home-assistant
  friendly_name: ESP32-S3 Home Assistant
  # The fitted ring in the operator photo has 12 WS2812/NeoPixel pixels.
  led_ring_count: "12"

esphome:
  includes:
    - audio/
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2026.7.0
  project:
    name: adamshub.esp32s3-home-assistant
    version: "2.0.0-dev"
  on_boot:
    - priority: -100
      then:
        - lambda: id(boot_session_nonce) = esp_random();
        - speaker.volume_set:
            id: speaker_out
            volume: !lambda |-
              // Convert the displayed linear amplitude percentage into the
              // I2S speaker's -49 dB..0 dB control. This makes 0..100% honest:
              // 50% is half PCM amplitude and 100% is unattenuated PCM.
              const float level = fmaxf(0.0f, fminf(1.0f, id(speaker_volume).state / 100.0f));
              if (level <= 0.0f) return 0.0f;
              const float target_db = 20.0f * log10f(level);
              return fmaxf(0.0f, fminf(1.0f, (target_db + 49.0f) / 49.0f));
        - text_sensor.template.publish:
            id: voice_state
            state: "WAITING FOR HOME ASSISTANT"
        - text_sensor.template.publish:
            id: interaction_availability
            state: "BUSY - CONNECTING TO HOME ASSISTANT"
        - binary_sensor.template.publish:
            id: ready_for_voice
            state: OFF
        - script.execute: ring_processing

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"

psram:
  mode: octal
  speed: 80MHz

external_components:
  - source:
      type: local
      path: components
    components:
      - buffered_microphone

logger:
  level: DEBUG
  # This board exposes UART0 through its CH343 USB bridge on COM4.
  hardware_uart: UART0
  tx_buffer_size: 1024
  task_log_buffer_size: 1024
  logs:
    component: WARN

api:
  encryption:
    key: !secret api_encryption_key
  actions:
    - action: report_voice_result
      variables:
        command: string
        result: string
        success: bool
      then:
        - text_sensor.template.publish:
            id: matched_command
            state: !lambda return command;
        - text_sensor.template.publish:
            id: action_result
            state: !lambda return result;
        - lambda: |-
            id(action_reported) = true;
            id(action_succeeded) = success;
        - sensor.template.publish:
            id: wake_to_action_latency
            state: !lambda |-
              return id(wake_detected_ms) ? millis() - id(wake_detected_ms) : NAN;
        - lambda: |-
            ESP_LOGI("voice_trace", "ACTION %s | command=\"%s\" | result=\"%s\"",
                     success ? "OK" : "FAILED", command.c_str(), result.c_str());

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  reboot_timeout: 15min

web_server:
  port: 80
  version: 3
  # Load the tiny blocking stylesheet before the much larger JavaScript bundle
  # so the stock ESPHome shell cannot paint while the custom UI downloads.
  css_url: ""
  css_include: dashboard-bootstrap.css
  # The pinned ESPHome v3 UI and our log controls are bundled together so the
  # dashboard stays available without access to oi.esphome.io.
  js_url: ""
  js_include: dashboard-bundle.js
  compression: gzip
  log: true
  ota: false
  sorting_groups:
    - id: dashboard_voice
      name: "Voice Assistant"
      sorting_weight: 10
    - id: dashboard_connection
      name: "Connection"
      sorting_weight: 20
    - id: dashboard_health
      name: "Device Health"
      sorting_weight: 30
    - id: dashboard_recovery
      name: "Recovery"
      sorting_weight: 40

debug:
  update_interval: 10s

globals:
  - id: wake_feedback_variant
    type: uint8_t
    restore_value: false
    initial_value: "0"
  - id: boot_session_nonce
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: session_sequence
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: action_reported
    type: bool
    restore_value: false
    initial_value: "false"
  - id: action_succeeded
    type: bool
    restore_value: false
    initial_value: "false"
  - id: pipeline_started_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: wake_detected_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: speech_started_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: transcript_ready_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: speech_ended_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: pipeline_failed
    type: bool
    restore_value: false
    initial_value: "false"

i2c:
  id: display_bus
  sda: GPIO6
  scl: GPIO5
  frequency: 400kHz
  scan: true

i2s_audio:
  - id: microphone_bus
    i2s_bclk_pin: GPIO15
    i2s_lrclk_pin: GPIO16
  - id: speaker_bus
    i2s_bclk_pin: GPIO17
    i2s_lrclk_pin: GPIO18

microphone:
  - platform: i2s_audio
    id: microphone_in
    i2s_audio_id: microphone_bus
    i2s_din_pin: GPIO7
    adc_type: external
    channel: left
    pdm: false
    sample_rate: 16000
    bits_per_sample: 32bit
    correct_dc_offset: true
  # Voice Assistant receives a calibrated slice from before the local wake
  # callback plus all samples captured during the handoff. microWakeWord stays
  # on the physical mic, so replay can never retrigger the wake detector.
  - platform: buffered_microphone
    id: command_microphone
    source_microphone: microphone_in
    history_duration: 1s
    pre_roll_duration: 260ms

# Status-owned 12-pixel ring. It is deliberately internal so Home Assistant and
# the local dashboard cannot override the usability signal.
light:
  - platform: esp32_rmt_led_strip
    id: led_ring
    internal: true
    pin: GPIO4
    chipset: WS2812
    num_leds: ${led_ring_count}
    rgb_order: GRB
    restore_mode: ALWAYS_OFF
    effects:
      - addressable_lambda:
          name: "Listening Yellow Rotate"
          update_interval: 75ms
          lambda: |-
            static uint16_t head = 0;
            it.all() = Color(0, 0, 0);
            const uint16_t count = it.size();
            if (count == 0) return;
            // Exactly three pixels form a bright-to-dim listening comet.
            const uint8_t levels[3] = {255, 120, 42};
            for (uint8_t tail = 0; tail < 3; tail++) {
              const uint16_t pixel = (head + count - tail) % count;
              it[pixel] = Color(levels[tail], levels[tail] * 45 / 100, 0);
            }
            head = (head + 1) % count;
      - pulse:
          name: "Processing Yellow Breathe"
          transition_length: 600ms
          update_interval: 600ms
          min_brightness: 10%
          max_brightness: 34%
      - pulse:
          name: "Unavailable Red Pulse"
          transition_length: 700ms
          update_interval: 700ms
          min_brightness: 8%
          max_brightness: 35%

speaker:
  - platform: i2s_audio
    id: speaker_out
    i2s_audio_id: speaker_bus
    i2s_dout_pin: GPIO8
    dac_type: external
    # The proven legacy driver sent identical left/right slots. Force the
    # upstream audio pipeline to duplicate mono into stereo so the fitted
    # amplifier receives audio regardless of its L/R-select strap.
    channel: stereo
    # ESPHome's Assist API streams signed 16-bit, 16 kHz mono PCM. Keep local
    # wake feedback in that same format so it cannot leave stale stream
    # metadata behind and corrupt the following spoken confirmation.
    sample_rate: 16000
    bits_per_sample: 16bit
    # MAX98357A native I2S uses the Philips one-bit delay. The former MSB mode
    # was left-justified and produced torn/distorted output. Earlier claims
    # that standard I2S was silent came from a test with incorrect metadata.
    i2s_comm_fmt: stand_i2s
    buffer_duration: 300ms
    timeout: 500ms

font:
  - file: "gfonts://Roboto"
    id: font_small
    size: 10
    glyphs: " !%&'(),-.:0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz"
  - file: "gfonts://Roboto@500"
    id: font_state
    size: 14
    glyphs: " !%&'(),-.:0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz"

display:
  - platform: ssd1306_i2c
    id: oled
    i2c_id: display_bus
    model: "SSD1306 128x64"
    address: 0x3C
    contrast: 65%
    update_interval: 250ms
    lambda: |-
      it.printf(64, 0, id(font_small), TextAlign::TOP_CENTER, "HEY BURDEN");
      it.line(0, 13, 127, 13);

      // The raw diagnostic states are useful in Home Assistant but several are
      // wider than a 128 px OLED. Render a deliberately bounded, human-facing
      // two-line status instead of allowing the display driver to clip text.
      const std::string state = id(voice_state).state;
      std::string line_one;
      std::string line_two;
      if (state == "WAITING FOR HOME ASSISTANT") {
        line_one = "CONNECTING";
        line_two = "HOME ASSISTANT";
      } else if (state == "WAITING FOR WAKE WORD") {
        line_one = "READY";
        line_two = "SAY HEY BURDEN";
      } else if (state == "WAKE WORD DISABLED") {
        line_one = "WAKE WORD";
        line_two = "DISABLED";
      } else if (state == "HOME ASSISTANT OFFLINE") {
        line_one = "HOME ASSISTANT";
        line_two = "OFFLINE";
      } else if (state == "STARTING COMMAND") {
        line_one = "STARTING";
        line_two = "COMMAND";
      } else if (state == "HEARING SPEECH") {
        line_one = "HEARING";
        line_two = "SPEECH";
      } else if (state == "MATCHING COMMAND") {
        line_one = "MATCHING";
        line_two = "COMMAND";
      } else {
        line_one = state;
        if (line_one.size() > 17) {
          size_t split = line_one.rfind(' ', 17);
          if (split == std::string::npos) split = 17;
          line_two = line_one.substr(split + (line_one[split] == ' ' ? 1 : 0));
          line_one = line_one.substr(0, split);
          if (line_two.size() > 17) line_two = line_two.substr(0, 14) + "...";
        }
      }

      const bool has_request = id(last_request).has_state() && !id(last_request).state.empty();
      if (line_two.empty()) {
        it.printf(64, has_request ? 25 : 29, id(font_state), TextAlign::TOP_CENTER, "%s", line_one.c_str());
      } else {
        it.printf(64, has_request ? 17 : 21, id(font_state), TextAlign::TOP_CENTER, "%s", line_one.c_str());
        it.printf(64, has_request ? 33 : 39, id(font_state), TextAlign::TOP_CENTER, "%s", line_two.c_str());
      }
      if (has_request) {
        std::string request = id(last_request).state;
        if (request.size() > 14) request = request.substr(0, 11) + "...";
        it.printf(64, 53, id(font_small), TextAlign::TOP_CENTER, "Heard: %s", request.c_str());
      }

binary_sensor:
  - platform: status
    name: "Device Online"
    id: device_online
    entity_category: diagnostic
    web_server:
      sorting_group_id: dashboard_connection
      sorting_weight: 10
  - platform: template
    id: ready_for_voice
    name: "Ready for Voice"
    icon: mdi:account-voice
    device_class: running
    entity_category: diagnostic
    web_server:
      sorting_group_id: dashboard_voice
      sorting_weight: 5
  - platform: gpio
    id: boot_button
    name: "Physical Assist Button"
    internal: true
    pin:
      number: GPIO0
      inverted: true
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on: 30ms
      - delayed_off: 30ms
    on_press:
      - micro_wake_word.stop
      - voice_assistant.stop
      - delay: 50ms
      - voice_assistant.start:
          silence_detection: true
      - text_sensor.template.publish:
          id: interaction_availability
          state: "BUSY - WAIT FOR GREEN"
      - binary_sensor.template.publish:
          id: ready_for_voice
          state: OFF
      - script.execute: ring_listening
      - if:
          condition:
            switch.is_on: wake_sound_enabled
          then:
            - script.execute: play_feedback_tone

number:
  - platform: template
    id: command_pre_roll
    name: "One-Breath Pre-roll"
    icon: mdi:waveform
    entity_category: config
    unit_of_measurement: "ms"
    # Shorter values were observed to miss speech and hit the 15-second
    # no-speech timeout. Keep enough wake/command overlap for one-breath use.
    min_value: 180
    max_value: 340
    step: 20
    initial_value: 260
    restore_value: true
    optimistic: true
    set_action:
      - lambda: |-
          id(command_microphone).set_pre_roll_duration_ms(static_cast<uint32_t>(x));
          ESP_LOGI("buffered_microphone", "Dashboard pre-roll changed to %u ms", (unsigned) x);
    web_server:
      sorting_group_id: dashboard_voice
      sorting_weight: 24
  - platform: template
    id: speaker_volume
    name: "Speaker Volume"
    icon: mdi:volume-high
    unit_of_measurement: "%"
    # GAIN is now unconnected (9 dB), so expose the complete digital range.
    # The value is true PCM amplitude: 0% mutes and 100% is bit-perfect full
    # scale with no hidden attenuation.
    min_value: 0
    max_value: 100
    step: 5
    initial_value: 50
    restore_value: true
    optimistic: true
    set_action:
      - speaker.volume_set:
          id: speaker_out
          volume: !lambda |-
            const float level = fmaxf(0.0f, fminf(1.0f, x / 100.0f));
            if (level <= 0.0f) return 0.0f;
            const float target_db = 20.0f * log10f(level);
            return fmaxf(0.0f, fminf(1.0f, (target_db + 49.0f) / 49.0f));
    web_server:
      sorting_group_id: dashboard_voice
      sorting_weight: 25

switch:
  - platform: template
    id: wake_word_enabled
    name: "Wake Word Enabled"
    icon: mdi:microphone
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    web_server:
      sorting_group_id: dashboard_voice
      sorting_weight: 20
    turn_on_action:
      - if:
          condition:
            voice_assistant.connected
          then:
            - micro_wake_word.start
            - text_sensor.template.publish:
                id: interaction_availability
                state: "READY - SAY HEY BURDEN"
            - binary_sensor.template.publish:
                id: ready_for_voice
                state: ON
            - script.execute: ring_ready
    turn_off_action:
      - micro_wake_word.stop
      - voice_assistant.stop
      - text_sensor.template.publish:
          id: voice_state
          state: "WAKE WORD DISABLED"
      - text_sensor.template.publish:
          id: interaction_availability
          state: "UNAVAILABLE - WAKE WORD DISABLED"
      - binary_sensor.template.publish:
          id: ready_for_voice
          state: OFF
      - script.execute: ring_disabled
  - platform: template
    id: wake_sound_enabled
    name: Wake Sound
    icon: mdi:volume-source
    entity_category: config
    optimistic: true
    # Default to an audible acknowledgement. It is deliberately short and
    # quiet so buffered one-breath audio remains usable.
    restore_mode: ALWAYS_ON
    web_server:
      sorting_group_id: dashboard_voice
      sorting_weight: 23

button:
  - platform: template
    name: "Test Speaker"
    icon: mdi:volume-medium
    on_press:
      - script.execute:
          id: run_speaker_test
          kind: 0
    web_server:
      sorting_group_id: dashboard_voice
      sorting_weight: 26
  - platform: template
    name: "Test Chime"
    on_press:
      - script.execute: {id: run_speaker_test, kind: 1}
  - platform: template
    name: "Test Random Sound"
    on_press:
      - script.execute: {id: run_speaker_test, kind: 2}
  - platform: template
    name: "Test Soft Noise"
    on_press:
      - script.execute: {id: run_speaker_test, kind: 3}
  - platform: template
    name: "Test Speech A"
    on_press:
      - script.execute: {id: run_speaker_test, kind: 4}
  - platform: template
    name: "Test Speech B"
    on_press:
      - script.execute: {id: run_speaker_test, kind: 5}
  - platform: template
    name: "Test Speech Stereo"
    on_press:
      - script.execute: {id: run_speaker_test, kind: 6}
  - platform: template
    name: "Test Level Steps"
    on_press:
      - script.execute: {id: run_speaker_test, kind: 7}
  - platform: template
    name: "Stop Test Sound"
    on_press:
      - if:
          condition:
            script.is_running: run_speaker_test
          then:
            - script.stop: run_speaker_test
            - lambda: speaker_tests::stop(id(speaker_out));
            - script.execute: resume_local_wake_word
  - platform: restart
    name: "Restart Device"
    entity_category: diagnostic
    web_server:
      sorting_group_id: dashboard_recovery
      sorting_weight: 10
  - platform: safe_mode
    name: "Restart in Safe Mode"
    entity_category: diagnostic
    web_server:
      sorting_group_id: dashboard_recovery
      sorting_weight: 20

text_sensor:
  - platform: template
    id: current_session_id
    name: "Current Voice Session"
    icon: mdi:identifier
    update_interval: never
    entity_category: diagnostic
    web_server:
      sorting_group_id: dashboard_voice
      sorting_weight: 1
  - platform: template
    id: interaction_availability
    name: "Interaction Availability"
    icon: mdi:traffic-light
    update_interval: never
    web_server:
      sorting_group_id: dashboard_voice
      sorting_weight: 2
  - platform: template
    id: voice_state
    name: "Voice State"
    icon: mdi:state-machine
    update_interval: never
    web_server:
      sorting_group_id: dashboard_voice
      sorting_weight: 10
  - platform: template
    id: last_wake_word
    name: "Last Wake Word"
    icon: mdi:account-voice
    update_interval: never
    web_server:
      sorting_group_id: dashboard_voice
      sorting_weight: 30
  - platform: template
    id: last_request
    name: "Heard (Exact STT)"
    icon: mdi:text-recognition
    update_interval: never
    web_server:
      sorting_group_id: dashboard_voice
      sorting_weight: 40
  - platform: template
    id: last_response
    name: "Assistant Reply (Exact)"
    icon: mdi:message-reply-text
    update_interval: never
    web_server:
      sorting_group_id: dashboard_voice
      sorting_weight: 50
  - platform: template
    id: matched_command
    name: "Matched Command"
    icon: mdi:check-decagram-outline
    update_interval: never
    web_server:
      sorting_group_id: dashboard_voice
      sorting_weight: 52
  - platform: template
    id: action_result
    name: "Action Result"
    icon: mdi:lightning-bolt-circle
    update_interval: never
    web_server:
      sorting_group_id: dashboard_voice
      sorting_weight: 54
  - platform: template
    id: routing_outcome
    name: "Intent Routing Outcome"
    icon: mdi:source-branch-check
    update_interval: never
    web_server:
      sorting_group_id: dashboard_voice
      sorting_weight: 55
  - platform: template
    id: pipeline_timing
    name: "Last Pipeline Timing"
    icon: mdi:timer-check-outline
    update_interval: never
    web_server:
      sorting_group_id: dashboard_voice
      sorting_weight: 56
  - platform: template
    id: last_error
    name: "Last Error"
    icon: mdi:alert-circle-outline
    update_interval: never
    web_server:
      sorting_group_id: dashboard_voice
      sorting_weight: 60
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      entity_category: diagnostic
      web_server:
        sorting_group_id: dashboard_connection
        sorting_weight: 30
    ssid:
      name: "Connected SSID"
      entity_category: diagnostic
      web_server:
        sorting_group_id: dashboard_connection
        sorting_weight: 20
    mac_address:
      name: "Wi-Fi MAC"
      entity_category: diagnostic
      internal: true
  - platform: debug
    device:
      name: "Device Information"
      entity_category: diagnostic
      internal: true
    reset_reason:
      name: "Reset Reason"
      entity_category: diagnostic
      web_server:
        sorting_group_id: dashboard_health
        sorting_weight: 50
  - platform: version
    name: "ESPHome Version"
    entity_category: diagnostic
    web_server:
      sorting_group_id: dashboard_health
      sorting_weight: 60

sensor:
  - platform: template
    id: wake_to_pipeline_latency
    name: "Wake to Pipeline"
    icon: mdi:timer-sand
    unit_of_measurement: "ms"
    accuracy_decimals: 0
    update_interval: never
    entity_category: diagnostic
    web_server:
      sorting_group_id: dashboard_voice
      sorting_weight: 62
  - platform: template
    id: replay_audio_duration
    name: "Replayed Command Audio"
    icon: mdi:waveform
    unit_of_measurement: "ms"
    accuracy_decimals: 0
    update_interval: never
    entity_category: diagnostic
    web_server:
      sorting_group_id: dashboard_voice
      sorting_weight: 64
  - platform: template
    id: replay_audio_bytes
    name: "Replayed Command Bytes"
    icon: mdi:database-arrow-right
    unit_of_measurement: "B"
    accuracy_decimals: 0
    update_interval: never
    entity_category: diagnostic
    web_server:
      sorting_group_id: dashboard_voice
      sorting_weight: 65
  - platform: template
    id: wake_to_speech_latency
    name: "Wake to Speech Detection"
    icon: mdi:microphone-message
    unit_of_measurement: "ms"
    accuracy_decimals: 0
    update_interval: never
    entity_category: diagnostic
    web_server:
      sorting_group_id: dashboard_voice
