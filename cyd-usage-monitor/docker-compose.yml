services:
  cyd-monitor-app:
    build: .
    user: "${CYD_MONITOR_UID:-1000}:${CYD_MONITOR_GID:-1000}"
    init: true
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    networks: [monitor-ingress]
    ports:
      # Publish only the device listener, and only on the operator-configured
      # private LAN address. The dashboard listener remains Tunnel-only.
      - "${CYD_LAN_BIND_ADDRESS:-127.0.0.1}:${CYD_LAN_PORT:-8001}:8001"
    restart: always
    stop_grace_period: 15s
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      MONITOR_ADMIN_PASSWORD: ${MONITOR_ADMIN_PASSWORD:-}
      CYD_API_TOKEN: ${CYD_API_TOKEN:-}
      CYD_MONITOR_DATA_DIR: /app/data
      CYD_MONITOR_POLL_SECONDS: ${CYD_MONITOR_POLL_SECONDS:-90}
      CYD_MONITOR_ALERT_FAILURE_THRESHOLD: ${CYD_MONITOR_ALERT_FAILURE_THRESHOLD:-3}
    volumes:
      - ${CYD_MONITOR_HOST_DATA_DIR:-./data}:/app/data
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.create_connection(('127.0.0.1',8000),3); s.close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  cloudflared:
    image: cloudflare/cloudflared:2026.7.2
    init: true
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    restart: always
    depends_on:
      cyd-monitor-app:
        condition: service_healthy
    command: ["tunnel", "--no-autoupdate", "--loglevel", "info", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in .env}
    networks: [monitor-ingress]

  cyd-monitor-collector:
    build: .
    user: "${CYD_MONITOR_UID:-1000}:${CYD_MONITOR_GID:-1000}"
    init: true
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    command: ["python3", "/app/collector.py"]
    network_mode: host
    restart: always
    stop_grace_period: 20s
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      CYD_MONITOR_DATA_DIR: /app/data
      CYD_MONITOR_POLL_SECONDS: ${CYD_MONITOR_POLL_SECONDS:-90}
      CYD_MONITOR_ALERT_FAILURE_THRESHOLD: ${CYD_MONITOR_ALERT_FAILURE_THRESHOLD:-3}
      CYD_MONITOR_TIMEZONE: ${CYD_MONITOR_TIMEZONE:-UTC}
      CYD_MONITOR_PROFILE_ROOT: /profiles
      AGY_BIN: /opt/cyd-cli/agy
      CODEX_BIN: /opt/cyd-codex/node_modules/.bin/codex
      CYD_NODE_BIN: /opt/cyd-cli/node-bin
      WAHA_URL: ${WAHA_URL:-http://127.0.0.1:3000}
      WAHA_API_KEY: ${WAHA_API_KEY:-}
      WAHA_SESSION: ${WAHA_SESSION:-default}
      WAHA_ALERT_CHAT_ID: ${WAHA_ALERT_CHAT_ID:-}
      CYD_MONITOR_SMTP_HOST: ${CYD_MONITOR_SMTP_HOST:-}
      CYD_MONITOR_SMTP_PORT: ${CYD_MONITOR_SMTP_PORT:-587}
      CYD_MONITOR_SMTP_SECURITY: ${CYD_MONITOR_SMTP_SECURITY:-starttls}
      CYD_MONITOR_SMTP_USERNAME: ${CYD_MONITOR_SMTP_USERNAME:-}
      CYD_MONITOR_SMTP_PASSWORD: ${CYD_MONITOR_SMTP_PASSWORD:-}
      CYD_MONITOR_SMTP_FROM: ${CYD_MONITOR_SMTP_FROM:-}
      CYD_MONITOR_ALERT_EMAIL_TO: ${CYD_MONITOR_ALERT_EMAIL_TO:-}
    volumes:
      - ${CYD_MONITOR_HOST_DATA_DIR:-./data}:/app/data
      - ${CYD_MONITOR_HOST_PROFILE_DIR:-./profiles}:/profiles
      - ${AGY_HOST_PATH:?Set AGY_HOST_PATH in .env}:/opt/cyd-cli/agy:ro
      - ${CODEX_HOST_DIR:?Set CODEX_HOST_DIR in .env}:/opt/cyd-codex:ro
      - ${NODE_BIN_HOST_DIR:?Set NODE_BIN_HOST_DIR in .env}:/opt/cyd-cli/node-bin:ro
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m

networks:
  monitor-ingress:
    driver: bridge
